# ============================================================
# 每日前线 - 每日定时采集 + 自动部署（方案 A · 静态 JSON）
# 时区：北京时间 09:00 与 20:00 = UTC 01:00 与 12:00
# 跑完把 data/today.json + data/archive.json commit 回仓库，
# 并在同一个 workflow 内直接部署到 GitHub Pages。
# 关键：部署放在 collect job 之后的「同 workflow 内部 job」，
# 不依赖「push 触发另一个 workflow」，因此不受 GITHUB_TOKEN
# 连锁触发限制（那是之前站点不自动更新的根因）。
# ============================================================
name: Daily Update

on:
  # 每日两次采集（北京时间 09:00 / 20:00）
  schedule:
    - cron: "0 1 * * *"   # 北京时间 09:00
    - cron: "0 12 * * *"  # 北京时间 20:00

  # 允许手动触发（调试用）
  workflow_dispatch:
    inputs:
      modules:
        description: "指定模块（all/lol/football/ai）"
        required: false
        default: "all"

  # push 触发自检（改了 collector.py 自动跑一次）
  push:
    paths:
      - "backend/**"
      - ".github/workflows/daily-update.yml"

# 需要：写回仓库（commit 数据）+ 部署 Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false  # 不取消，保留前次结果

jobs:
  collect:
    name: 数据采集 + 提交 JSON
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 注入环境变量
        working-directory: backend
        run: |
          cat > .env <<EOF
          DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL=${{ vars.DASHSCOPE_BASE_URL }}
          DASHSCOPE_MODEL=${{ vars.DASHSCOPE_MODEL }}
          FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_BASE_URL=${{ vars.FOOTBALL_BASE_URL }}
          HF_TOKEN=${{ secrets.HF_TOKEN }}
          ARXIV_MAX_RESULTS=${{ vars.ARXIV_MAX_RESULTS || 20 }}
          ENABLE_LOL=${{ vars.ENABLE_LOL || true }}
          ENABLE_FOOTBALL=${{ vars.ENABLE_FOOTBALL || true }}
          ENABLE_AI=${{ vars.ENABLE_AI || true }}
          MAX_FETCH_PER_SOURCE=${{ vars.MAX_FETCH_PER_SOURCE || 50 }}
          KEEP_DAYS=${{ vars.KEEP_DAYS || 7 }}
          TZ=Asia/Shanghai
          EOF
          echo "✅ .env 已生成"

      - name: 执行采集
        working-directory: backend
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          MODULES="${{ github.event.inputs.modules || 'all' }}"
          echo "🚀 开始采集：模块=$MODULES"
          python collector.py --modules "$MODULES"
          echo "✅ 采集完成 → ../data/today.json"

      - name: 提交数据回仓库
        run: |
          git config user.name "daily-front-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/today.json data/archive.json
          if git diff --cached --quiet; then
            echo "⏭️ 无变化，跳过提交"
          else
            git commit -m "chore: 每日更新 $(date +'%F %T')"
            # data/*.json 已在 .gitattributes 标记为 merge=ours：
            # 远端若因并发采集/手动 push 领先本地，必须显式用 merge 策略拉取
            # （git 2.27+ 在分支分歧且未配置 pull 策略时会 fatal 退出），
            # merge 遇到 data/*.json 冲突会自动以本次新生成的快照覆盖。
            # 切勿用 --rebase：rebase 不会触发 .gitattributes 的 merge=ours，
            # 对全量重算的数据快照反而会因内容冲突失败。
            # 注册「ours」合并驱动：冲突时保留本次新生成的本地快照
            # （git 默认没有内置 ours 驱动，必须显式定义，否则 merge=ours 形同虚设）
            git config merge.ours.name "keep local generated data snapshot"
            git config merge.ours.driver "true"
            git pull --no-rebase origin main
            git push
            echo "✅ 已推送最新数据"
          fi

  deploy:
    name: 部署到 GitHub Pages
    # 关键：needs 依赖 collect，collect 已把最新数据 push 回 main。
    # 同一个 workflow 内的 job 依赖，不受「GITHUB_TOKEN 推送不触发新 workflow」限制。
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉代码（强制最新 main，含 collect 刚 push 的数据）
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          # 根目录含 index.html / data/ / .nojekyll
          path: "."

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
